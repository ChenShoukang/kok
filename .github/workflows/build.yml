name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare local PDF viewer
        run: npm ci --omit=optional
      - name: Check interface scripts
        run: npm run check
      - name: Check Windows PowerShell compatibility
        run: npm run check:windows
      - name: Audit dependency advisories
        run: npm run audit:dependencies
      - name: Audit source privacy
        shell: pwsh
        run: ./tools/audit-release.ps1
      - name: Audit Git history privacy
        run: npm run audit:history
      - name: Verify history scanner
        run: node tests/audit-history.cjs
      - name: Compile, test and package
        shell: pwsh
        run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: kok-${{ matrix.os }}-win-x64
          if-no-files-found: error
          path: |
            dist/kok-*-win-x64.zip
            dist/kok-*-win-x64.zip.sha256
  agent-ui:
    name: Agent desktop integration
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=optional
      - name: Compile isolated desktop host
        shell: pwsh
        run: ./build.ps1
      - name: Ensure signed Microsoft WebView2 runtime
        shell: pwsh
        run: ./tools/ensure-test-webview.ps1
      - name: Exercise Agent and MCP with local fixtures
        shell: pwsh
        run: |
          ./tools/test-desktop.ps1 -Suites @('agent','agent-interactions','agent-reliable','agent-runtime','agent-kernel','mcp')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-desktop-evidence
          if-no-files-found: ignore
          path: |
            test-output/**/results.json
            test-output/**/run.json
            test-output/**/failure.png
            test-output/**/kernel-*.png
            test-output/**/mcp-*.png
  release:
    name: Publish preview
    needs: [build, agent-ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: kok-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: kok-windows-2025-win-x64
          path: dist
      - name: Publish version
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/publish-release.ps1
