  <aside class="sidebar">
    <div class="nav-indicator" aria-hidden="true"></div>
    <a class="brand" href="#overview" data-route="overview" aria-label="kok 首页"><img src="logo.svg?v=0.5.1-refined" alt="" width="30" height="30"><span>kok</span></a>
    <div class="sidebar-scroll"><nav id="main-nav" aria-label="资料库分类"></nav>
    <div class="sidebar-rule"></div>
    <nav id="extra-nav" aria-label="快捷访问"></nav>
    <div class="collections-heading"><span>分类</span><button id="add-collection" class="icon-button" title="新建分类" aria-label="新建分类" data-icon="plus"></button></div><nav id="collections-nav" aria-label="自定义分类"></nav></div>
    <div class="sidebar-bottom"><button class="nav-item settings-button" id="settings-button" aria-label="设置"><span data-icon="settings"></span><span>设置</span></button></div>
  </aside>
  <div class="shell">
    <header class="topbar"><label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="搜索资料库" autocomplete="off" aria-label="搜索资料库"><kbd>Ctrl K</kbd></label><div class="import-control"><button class="button primary" id="import-top"><span data-icon="plus"></span>导入文件</button><button class="import-more" id="import-more" aria-label="更多导入选项" aria-expanded="false" aria-controls="import-menu"><span data-icon="chevron"></span></button><div id="import-menu" class="import-menu hidden"><button data-action="importFiles"><span data-icon="document"></span>导入文件</button><button data-action="importFolder"><span data-icon="folder"></span>导入文件夹</button></div></div></header>
    <main id="main" tabindex="-1"></main>
  </div>
  <section class="music-bar hidden" id="music-bar" aria-label="音乐播放器"><div class="now-playing"><button class="mini-cover" id="open-now-playing" data-icon="music" aria-label="打开完整播放器" title="打开完整播放器"></button><div><b id="track-name">未播放</b><small id="track-subtitle"></small></div><button class="icon-button" id="track-favorite" title="收藏音乐" aria-label="收藏音乐" data-icon="heart"></button></div><div class="music-center"><div class="transport"><button class="icon-button" id="shuffle" title="随机播放" aria-label="随机播放" data-icon="shuffle"></button><button class="icon-button" id="prev-track" title="上一首" aria-label="上一首" data-icon="skipBack"></button><button class="play-main" id="play-pause" title="播放或暂停" aria-label="播放或暂停" data-icon="play"></button><button class="icon-button" id="next-track" title="下一首" aria-label="下一首" data-icon="skipForward"></button><button class="icon-button" id="repeat" title="循环播放" aria-label="循环播放" data-icon="repeat"></button></div><div class="timeline"><span id="current-time">0:00</span><input id="audio-seek" type="range" min="0" max="1000" value="0" aria-label="音乐播放进度"><span id="duration">0:00</span></div></div><div class="volume-controls"><span data-icon="volume"></span><input type="range" id="volume" min="0" max="1" step="0.01" value="0.7" aria-label="音量"><button class="icon-button" id="queue-button" title="播放队列" aria-label="播放队列" data-icon="listMusic"></button><button class="icon-button" id="close-player" title="停止音乐" aria-label="停止音乐" data-icon="close"></button></div></section>
  <audio id="audio" preload="metadata"></audio>
  <dialog id="viewer" class="viewer"><div class="viewer-header"><div class="viewer-title"><span id="viewer-icon"></span><div><b id="viewer-title"></b><small id="viewer-subtitle"></small></div></div><div class="viewer-actions"><button class="icon-button" id="viewer-favorite" title="收藏" aria-label="收藏" data-icon="heart"></button><button class="icon-button" id="notes-button" title="笔记" aria-label="笔记" data-icon="edit"></button><button class="icon-button" id="external-button" title="使用系统应用打开" aria-label="使用系统应用打开" data-icon="external"></button><button class="icon-button" id="close-viewer" title="关闭 (Esc)" aria-label="关闭" data-icon="close"></button></div></div><div id="viewer-content"></div><aside id="notes-panel" class="notes-panel hidden"><h3>笔记</h3><textarea id="notes" placeholder="写下想法…" aria-label="文件笔记"></textarea><button class="button primary" id="save-notes">保存笔记</button></aside></dialog>
